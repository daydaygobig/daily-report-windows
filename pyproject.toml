[tool.poetry]
name = "trae-scheduler"
version = "0.1.0"
description = "智能群聊日报助手 V4"
authors = ["Trae Team <team@example.com>"]
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
pydantic-settings = "^2.3.0"
httpx = "^0.27.0"
apscheduler = "^3.10.4"
cryptography = "^42.0.5"
loguru = "^0.7.2"
python-multipart = "^0.0.9"
tiktoken = "^0.12.0"
beautifulsoup4 = "^4.14.2"
html5lib = "^1.1"
openpyxl = "^3.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"
ruff = "^0.4.2"
respx = "^0.22.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
